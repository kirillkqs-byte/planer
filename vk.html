<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Планер — возврат из VK ID</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #E9E3D8; color: #22252A; font: 16px/1.5 system-ui, 'Segoe UI', sans-serif; }
  main { max-width: 440px; padding: 28px; background: #F7F3EB; border-radius: 16px; box-shadow: 0 10px 30px -12px rgba(40,34,26,.35); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 10px; color: #555049; }
  a { color: #2E4A8B; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Возвращаю в Планер…</h1>
  <p id="msg">Вход через VK ID прошёл. Сейчас откроется ваш планер на этом компьютере.</p>
  <p id="manual" hidden>Если ничего не произошло, нажмите: <a id="go" href="#">вернуться в Планер</a>. Планер должен быть запущен.</p>
</main>
<script>
  // Страница-переходник: VK ID требует https-адрес, а планер работает на компьютере (http://127.0.0.1).
  // Она ничего не хранит и никуда не отправляет — только передаёт код входа обратно в локальный планер.
  (function () {
    var q = new URLSearchParams(location.search);
    var state = q.get('state') || '';
    var m = state.match(/^p(\d{2,5})\./);
    var port = m ? m[1] : '3100';
    var target = 'http://127.0.0.1:' + port + '/vk-oauth/callback' + location.search + location.hash;
    var go = document.getElementById('go');
    go.href = target;
    if (!q.get('code') && !q.get('error')) {
      document.getElementById('msg').textContent = 'Эта страница нужна только для входа через VK ID из Планера.';
      return;
    }
    setTimeout(function () { document.getElementById('manual').hidden = false; }, 2500);
    location.replace(target);
  })();
</script>
</body>
</html>
