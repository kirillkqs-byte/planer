<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Постмаркер — возврат из VK ID</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #E9E3D8; color: #22252A; font: 16px/1.5 system-ui, 'Segoe UI', sans-serif; }
  main { max-width: 440px; padding: 28px; background: #F7F3EB; border-radius: 16px; box-shadow: 0 10px 30px -12px rgba(40,34,26,.35); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 10px; color: #555049; }
  a { color: #2E4A8B; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Возвращаю в Постмаркер…</h1>
  <p id="msg">Вход через VK ID прошёл. Сейчас откроется ваш Постмаркер на этом компьютере.</p>
  <p id="manual" hidden>Если ничего не произошло, нажмите: <a id="go" href="#">вернуться в Постмаркер</a>. Постмаркер должен быть запущен.</p>
</main>
<script>
  // Страница-переходник: VK ID требует https-адрес, а Постмаркер работает на компьютере (http://127.0.0.1).
  // Она ничего не хранит и никуда не отправляет — только передаёт код входа обратно в локальный Постмаркер.
  (function () {
    var q = new URLSearchParams(location.search);
    // Открыли как мини-приложение ВК (ВК передаёт vk_app_id) — это страница мини-приложения
    if (q.get('vk_app_id')) { location.replace('miniapp.html' + location.search + location.hash); return; }
    var state = q.get('state') || '';
    // Адрес Постмаркера — из state (его создал сам Постмаркер): o<base64url(https-адрес)> или p<порт> для ПК
    var PLANER_HOSTS = ['postmarker.ru', 'www.postmarker.ru']; // разрешённые https-Постмаркеры
    var origin = 'http://127.0.0.1:3100';
    var mo = state.match(/^o([A-Za-z0-9_-]{4,200})\./), mp = state.match(/^p(\d{2,5})\./);
    if (mo) {
      origin = '';
      try {
        var o = new URL(atob(mo[1].replace(/-/g, '+').replace(/_/g, '/')));
        if (o.protocol === 'https:' && PLANER_HOSTS.indexOf(o.hostname) >= 0) origin = o.origin;
      } catch (e) { /* не адрес */ }
    } else if (mp) origin = 'http://127.0.0.1:' + mp[1];
    if (!origin) { document.getElementById('msg').textContent = 'Этот адрес Постмаркера не разрешён на странице-переходнике.'; return; }
    var target = origin + '/vk-oauth/callback' + location.search + location.hash;
    var go = document.getElementById('go');
    go.href = target;
    if (!q.get('code') && !q.get('error')) {
      document.getElementById('msg').textContent = 'Эта страница нужна только для входа через VK ID из Постмаркера.';
      return;
    }
    setTimeout(function () { document.getElementById('manual').hidden = false; }, 2500);
    location.replace(target);
  })();
</script>
</body>
</html>
